<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Abiline</title>
<meta name="description" content="Päevaplaan, toit ja makrod, kaal, kalender ja eesmärgid ühes kohas.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abiline">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
<style>
#splash{position:fixed;inset:0;z-index:50;background:#17382e;display:grid;place-items:center;transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
#splash div{display:grid;justify-items:center;gap:20px;color:#f4f0e8;font:700 30px/1 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase}
#splash circle+circle{stroke-dasharray:0 100;animation:sp 1s cubic-bezier(.2,.8,.2,1) .1s forwards}
@keyframes sp{to{stroke-dasharray:72 100}}
@media (prefers-reduced-motion:reduce){#splash circle+circle{animation:none;stroke-dasharray:72 100}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div><svg width="92" height="92" viewBox="0 0 92 92"><circle cx="46" cy="46" r="38" fill="none" stroke="#2a5145" stroke-width="9"/><circle cx="46" cy="46" r="38" fill="none" stroke="#f4f0e8" stroke-width="9" stroke-linecap="round" pathLength="100" transform="rotate(-90 46 46)"/><circle cx="46" cy="46" r="8" fill="#d9a066"/></svg>Abiline</div></div>
<div id="app">
<main id="view"></main>
<nav id="nav" aria-label="Peamenüü"></nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
</div>
<noscript>Abiline vajab töötamiseks JavaScripti.</noscript>
<script src="./app.js"></script>
</body>
</html>
